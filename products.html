<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제품 카탈로그 | 세기텔콤</title>
  <style>
    :root {
      --primary: #0a3d6b;
      --primary-light: #1565c0;
      --accent: #00b0ff;
      --gray-100: #f4f6f9;
      --gray-200: #e0e6ee;
      --gray-500: #6b7a8d;
      --gray-800: #1e2a38;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      color: var(--gray-800);
      background: var(--gray-100);
    }

    /* ── 헤더 ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    nav {
      max-width: 1200px; margin: 0 auto;
      padding: 0 1.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-size: 1.35rem; font-weight: 800;
      color: var(--primary); text-decoration: none; letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 1.75rem; list-style: none; align-items: center; }
    .nav-links a {
      text-decoration: none; font-size: 0.9rem; font-weight: 600;
      color: var(--gray-800); transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--primary-light); }
    .nav-cta {
      background: var(--primary); color: var(--white) !important;
      padding: 0.45rem 1.1rem; border-radius: 6px;
    }
    .nav-cta:hover { background: var(--primary-light) !important; color: var(--white) !important; }
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      cursor: pointer; padding: 4px; background: none; border: none;
    }
    .hamburger span {
      display: block; width: 24px; height: 2px;
      background: var(--primary); border-radius: 2px; transition: all 0.3s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu {
      display: none; flex-direction: column;
      background: var(--white); border-top: 1px solid var(--gray-200);
      padding: 1rem 1.5rem 1.5rem; gap: 0.75rem;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      text-decoration: none; font-size: 0.95rem; font-weight: 600;
      color: var(--gray-800); padding: 0.5rem 0;
      border-bottom: 1px solid var(--gray-100);
    }

    /* ── 페이지 헤더 ── */
    .page-hero {
      background: linear-gradient(135deg, var(--primary) 0%, #0d52a0 100%);
      color: var(--white); padding: 3.5rem 1.5rem 3rem; text-align: center;
    }
    .page-hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; margin-bottom: 0.6rem; }
    .page-hero p { font-size: 0.95rem; opacity: 0.8; }

    /* ── 컨트롤 바 ── */
    .controls {
      max-width: 1200px; margin: 0 auto;
      padding: 2rem 1.5rem 0;
      display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;
      justify-content: space-between;
    }

    .search-box {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--white); border: 1.5px solid var(--gray-200);
      border-radius: 10px; padding: 0.6rem 1rem;
      flex: 1; max-width: 380px;
      transition: border-color 0.2s;
    }
    .search-box:focus-within { border-color: var(--primary-light); }
    .search-box svg { color: var(--gray-500); flex-shrink: 0; }
    .search-box input {
      border: none; outline: none; font-size: 0.9rem;
      color: var(--gray-800); background: transparent; width: 100%;
      font-family: inherit;
    }
    .search-box input::placeholder { color: var(--gray-500); }

    .result-count {
      font-size: 0.875rem; color: var(--gray-500); font-weight: 600;
      white-space: nowrap;
    }
    .result-count strong { color: var(--primary); }

    .filter-tabs {
      max-width: 1200px; margin: 0 auto;
      padding: 1rem 1.5rem 0;
      display: flex; gap: 0.5rem; flex-wrap: wrap;
    }
    .filter-tab {
      padding: 0.45rem 1rem; border-radius: 50px;
      border: 1.5px solid var(--gray-200);
      background: var(--white); font-size: 0.85rem; font-weight: 600;
      color: var(--gray-500); cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .filter-tab:hover { border-color: var(--primary-light); color: var(--primary-light); }
    .filter-tab.active {
      background: var(--primary); border-color: var(--primary);
      color: var(--white);
    }

    /* ── 제품 그리드 ── */
    .products-wrap {
      max-width: 1200px; margin: 0 auto;
      padding: 1.5rem 1.5rem 4rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background: var(--white); border-radius: 14px;
      border: 1.5px solid var(--gray-200);
      padding: 1.75rem 1.5rem;
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(10,61,107,0.12);
      border-color: var(--primary-light);
    }

    .card-img {
      width: 100%; aspect-ratio: 4/3;
      object-fit: contain; border-radius: 8px;
      background: var(--gray-100);
      display: block; margin-bottom: 0.25rem;
    }
    .card-img-placeholder {
      width: 100%; aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--gray-100), var(--gray-200));
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; margin-bottom: 0.25rem;
      color: var(--gray-500); font-size: 2.5rem;
    }

    .card-brand {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--accent);
    }
    .card-model {
      font-size: 1.3rem; font-weight: 800; color: var(--primary); line-height: 1.2;
    }
    .card-category {
      display: inline-flex; align-items: center;
      background: var(--gray-100); border-radius: 50px;
      padding: 0.2rem 0.7rem; font-size: 0.75rem;
      font-weight: 600; color: var(--gray-500);
      width: fit-content;
    }
    .card-desc {
      font-size: 0.875rem; color: var(--gray-500);
      line-height: 1.6; flex: 1;
    }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 0.75rem; border-top: 1px solid var(--gray-100);
      margin-top: auto;
    }
    .card-detail-btn {
      font-size: 0.82rem; font-weight: 700;
      color: var(--primary-light); display: flex; align-items: center; gap: 0.3rem;
    }
    .card-pdf-icon {
      width: 28px; height: 28px; background: #fff0f0;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: #e53935;
    }

    /* 데이터 없음 */
    .empty-state {
      grid-column: 1 / -1; text-align: center;
      padding: 5rem 1rem; color: var(--gray-500);
    }
    .empty-state svg { margin-bottom: 1rem; opacity: 0.3; }
    .empty-state p { font-size: 1rem; font-weight: 600; }

    /* ── 모달 ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(10,30,50,0.55); z-index: 500;
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--white); border-radius: 20px;
      width: 100%; max-width: 720px; max-height: 90vh;
      overflow-y: auto; position: relative;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .modal-header {
      background: linear-gradient(135deg, var(--primary), #0d52a0);
      color: var(--white); padding: 2rem 2rem 1.75rem;
      border-radius: 20px 20px 0 0;
      display: flex; gap: 1.5rem; align-items: flex-start;
    }
    .modal-header-text { flex: 1; }
    .modal-brand { font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px; opacity: 0.7; text-transform: uppercase; }
    .modal-model { font-size: 2rem; font-weight: 900; letter-spacing: -1px; margin: 0.2rem 0 0.5rem; }
    .modal-category {
      display: inline-block; background: rgba(255,255,255,0.15);
      border-radius: 50px; padding: 0.2rem 0.8rem;
      font-size: 0.8rem; font-weight: 600;
    }
    .modal-header-img {
      width: 140px; min-width: 140px; aspect-ratio: 1;
      object-fit: contain; border-radius: 12px;
      background: rgba(255,255,255,0.12); padding: 0.5rem;
    }
    .modal-header-img-placeholder {
      width: 140px; min-width: 140px; aspect-ratio: 1;
      background: rgba(255,255,255,0.08); border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
    }
    .modal-close {
      background: rgba(255,255,255,0.15); border: none; color: var(--white);
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      font-size: 1.1rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: background 0.2s; font-family: inherit; align-self: flex-start;
    }
    .modal-close:hover { background: rgba(255,255,255,0.28); }

    .modal-body { padding: 2rem; }

    .modal-short-desc {
      font-size: 1rem; color: var(--gray-500);
      margin-bottom: 1.75rem; line-height: 1.7;
    }

    .modal-section-title {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--primary-light);
      margin-bottom: 0.9rem;
    }

    .features-list {
      list-style: none; display: flex; flex-direction: column; gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .features-list li {
      display: flex; align-items: flex-start; gap: 0.6rem;
      font-size: 0.9rem; color: var(--gray-800); line-height: 1.5;
    }
    .features-list li::before {
      content: '✓';
      color: var(--accent); font-weight: 900;
      flex-shrink: 0; margin-top: 1px;
    }

    .specs-table {
      width: 100%; border-collapse: collapse;
      font-size: 0.875rem; margin-bottom: 2rem;
      border-radius: 10px; overflow: hidden;
      border: 1px solid var(--gray-200);
    }
    .specs-table tr:nth-child(odd)  td:first-child { background: var(--gray-100); }
    .specs-table tr:nth-child(even) td:first-child { background: #edf1f7; }
    .specs-table td {
      padding: 0.65rem 1rem; border-bottom: 1px solid var(--gray-200);
      vertical-align: top;
    }
    .specs-table tr:last-child td { border-bottom: none; }
    .specs-table td:first-child {
      font-weight: 700; color: var(--primary);
      width: 38%; white-space: nowrap;
    }
    .specs-table td:last-child { color: var(--gray-800); }

    .modal-empty {
      background: var(--gray-100); border-radius: 10px;
      padding: 1.5rem; text-align: center;
      color: var(--gray-500); font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .modal-actions {
      display: flex; gap: 0.75rem; flex-wrap: wrap;
      padding-top: 1.25rem; border-top: 1px solid var(--gray-200);
    }
    .btn-pdf {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #e53935; color: var(--white);
      padding: 0.75rem 1.5rem; border-radius: 8px;
      font-size: 0.9rem; font-weight: 700;
      text-decoration: none; transition: opacity 0.2s;
    }
    .btn-pdf:hover { opacity: 0.88; }
    .btn-contact {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--primary); color: var(--white);
      padding: 0.75rem 1.5rem; border-radius: 8px;
      font-size: 0.9rem; font-weight: 700;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-contact:hover { background: var(--primary-light); }

    /* ── 반응형 ── */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      .modal { max-height: 95vh; border-radius: 16px 16px 0 0; }
      .modal-overlay { align-items: flex-end; padding: 0; }
      .modal-header { border-radius: 16px 16px 0 0; }
      .modal-model { font-size: 1.6rem; }
      .modal-header-img, .modal-header-img-placeholder { width: 90px; min-width: 90px; }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <nav>
      <a class="logo" href="segitelcom.html">세기<span>텔콤</span></a>
      <ul class="nav-links">
        <li><a href="segitelcom.html#about">회사 소개</a></li>
        <li><a href="products.html" class="active">취급 제품</a></li>
        <li><a href="segitelcom.html#values">핵심 가치</a></li>
        <li><a href="segitelcom.html#contact" class="nav-cta">문의하기</a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="메뉴">
        <span></span><span></span><span></span>
      </button>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
      <a href="segitelcom.html#about">회사 소개</a>
      <a href="products.html">취급 제품</a>
      <a href="segitelcom.html#values">핵심 가치</a>
      <a href="segitelcom.html#contact">문의하기</a>
    </div>
  </header>

  <!-- 페이지 헤더 -->
  <div class="page-hero">
    <h1>취급 제품 카탈로그</h1>
    <p>세기텔콤이 공급하는 전문 통신장비 제품을 확인하세요.</p>
  </div>

  <!-- 검색 + 결과 수 -->
  <div class="controls">
    <div class="search-box">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="모델명 또는 키워드 검색..." />
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>

  <!-- 카테고리 필터 -->
  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-cat="all">전체</button>
  </div>

  <!-- 제품 그리드 -->
  <div class="products-wrap">
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- 제품 상세 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <div id="mHeaderImg"></div>
        <div class="modal-header-text">
          <div class="modal-brand" id="mBrand"></div>
          <div class="modal-model" id="mModel"></div>
          <div class="modal-category" id="mCategory"></div>
        </div>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <p class="modal-short-desc" id="mShortDesc"></p>

        <div id="featuresSection">
          <div class="modal-section-title">주요 특징</div>
          <ul class="features-list" id="mFeatures"></ul>
        </div>

        <div id="specsSection">
          <div class="modal-section-title">제품 사양</div>
          <table class="specs-table" id="mSpecs"></table>
        </div>

        <div class="modal-actions">
          <a id="mPdfBtn" href="#" target="_blank" class="btn-pdf">
            📄 PDF 브로슈어 보기
          </a>
          <a href="segitelcom.html#contact" class="btn-contact">
            💬 제품 문의하기
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MAIN_BRANDS = ['Fitel', 'Northlab', '3SAE'];
    const BRANDS = [
      { key: 'Fitel',    label: 'Fitel · Furukawa' },
      { key: 'Northlab', label: 'Northlab' },
      { key: '3SAE',     label: '3SAE Technologies' },
      { key: '기타',     label: '기타' },
    ];

    let allProducts = [];
    let activeBrand = 'all';
    let searchQuery = '';

    async function loadProducts() {
      const res = await fetch('products.json');
      allProducts = await res.json();
      buildFilterTabs();
      applyUrlBrand();
      renderGrid();
    }

    function buildFilterTabs() {
      const tabs = document.getElementById('filterTabs');
      BRANDS.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'filter-tab';
        btn.dataset.brand = b.key;
        btn.textContent = b.label;
        btn.addEventListener('click', () => setBrand(b.key));
        tabs.appendChild(btn);
      });
    }

    function applyUrlBrand() {
      const param = new URLSearchParams(location.search).get('brand');
      if (param) setBrand(param);
    }

    function setBrand(brand) {
      activeBrand = brand;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.toggle('active', (t.dataset.brand || 'all') === brand);
      });
      renderGrid();
    }

    function matchesBrand(p) {
      if (activeBrand === 'all') return true;
      if (activeBrand === '기타') return !MAIN_BRANDS.includes(p.brand);
      return p.brand === activeBrand;
    }

    function renderGrid() {
      const q = searchQuery.toLowerCase();
      const filtered = allProducts.filter(p => {
        const matchQ = !q ||
          p.model.toLowerCase().includes(q) ||
          p.brand.toLowerCase().includes(q) ||
          p.shortDesc.toLowerCase().includes(q) ||
          p.categoryLabel.toLowerCase().includes(q);
        return matchesBrand(p) && matchQ;
      });

      const grid = document.getElementById('productsGrid');
      const count = document.getElementById('resultCount');
      count.innerHTML = `총 <strong>${filtered.length}</strong>개 제품`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <p>검색 결과가 없습니다.</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card" data-id="${p.id}" tabindex="0" role="button" aria-label="${p.brand} ${p.model} 상세보기">
          ${p.image
            ? `<img class="card-img" src="${p.image}" alt="${p.model}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : ''}
          <div class="card-img-placeholder" style="${p.image ? 'display:none' : ''}">📦</div>
          <div class="card-brand">${p.brand}</div>
          <div class="card-model">${p.model}</div>
          <div class="card-category">${p.categoryLabel}</div>
          <div class="card-desc">${p.shortDesc || '&nbsp;'}</div>
          <div class="card-footer">
            <span class="card-detail-btn">상세 보기 →</span>
            ${p.pdf ? '<div class="card-pdf-icon">PDF</div>' : ''}
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.id));
        card.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(card.dataset.id); });
      });
    }

    function openModal(id) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;

      document.getElementById('mBrand').textContent = p.brand;
      document.getElementById('mModel').textContent = p.model;
      document.getElementById('mCategory').textContent = p.categoryLabel;
      document.getElementById('mShortDesc').textContent = p.shortDesc || '';

      const imgWrap = document.getElementById('mHeaderImg');
      if (p.image) {
        imgWrap.innerHTML = `<img class="modal-header-img" src="${p.image}" alt="${p.model}" onerror="this.outerHTML='<div class=modal-header-img-placeholder>📦</div>'">`;
      } else {
        imgWrap.innerHTML = `<div class="modal-header-img-placeholder">📦</div>`;
      }

      // 특징
      const featSec = document.getElementById('featuresSection');
      const featList = document.getElementById('mFeatures');
      if (p.features && p.features.length) {
        featList.innerHTML = p.features.map(f => `<li>${f}</li>`).join('');
        featSec.style.display = '';
      } else {
        featSec.style.display = 'none';
      }

      // 스펙
      const specSec = document.getElementById('specsSection');
      const specTable = document.getElementById('mSpecs');
      if (p.specs && p.specs.length) {
        specTable.innerHTML = p.specs.map(([k, v]) =>
          `<tr><td>${k}</td><td>${v}</td></tr>`
        ).join('');
        specSec.style.display = '';
      } else {
        specSec.innerHTML = '<div class="modal-empty">사양 정보를 준비 중입니다.</div>';
        specSec.style.display = '';
      }

      // PDF
      const pdfBtn = document.getElementById('mPdfBtn');
      if (p.pdf) {
        pdfBtn.href = p.pdf;
        pdfBtn.style.display = '';
      } else {
        pdfBtn.style.display = 'none';
      }

      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
      document.getElementById('modal').scrollTop = 0;
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    document.getElementById('searchInput').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderGrid();
    });

    // 햄버거
    const hamburger = document.getElementById('hamburger');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      document.getElementById('mobileMenu').classList.toggle('open');
    });

    loadProducts();
  </script>
</body>
</html>
